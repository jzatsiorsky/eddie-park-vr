<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eddie Park &amp; House — Low-Poly 3D VR Environment</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  #canvas-container {
    width: 100vw; height: 100vh;
    background: linear-gradient(to bottom, rgb(92, 158, 230) 0%, rgb(199, 224, 245) 100%);
  }
  .hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px);
    border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 12px;
    padding: 14px 18px; max-width: 390px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  .hud h1 { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #38bdf8; }
  .hud p { font-size: 12px; color: #cbd5e1; line-height: 1.4; margin-bottom: 10px; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  button {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
    padding: 7px 10px; border-radius: 7px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  button:hover, button.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
  .btn-wide { grid-column: span 2; background: #0f3f5c; border-color: #0284c7; }
  .controls-hint { font-size: 11px; color: #94a3b8; border-top: 1px solid rgba(148,163,184,0.18); padding-top: 7px; }
  #ref-card {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(12px);
    border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 12px;
    padding: 10px; width: min(420px, 44vw); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: none;
  }
  #ref-card.visible { display: block; }
  #ref-card h2 { font-size: 12px; color: #cbd5e1; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  #ref-card img { width: 100%; height: auto; border-radius: 8px; display: block; }
  #park-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(15, 23, 42, 0.85); color: #38bdf8; font-size: 15px; font-weight: 600; z-index: 20;
    transition: opacity 0.3s; pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="park-loading">Loading 3D Low-Poly Park Model...</div>
<div id="canvas-container"></div>
<div class="hud">
  <h1>Eddie Park &amp; House — 3D VR Park</h1>
  <p>Low-poly 3D VR environment generated from aerial imagery (115m &times; 85m, calibrated 123&deg; ESE sun shadows).</p>
  <div class="btn-grid">
    <button onclick="setCam('player_west')">1. West Lawn VR POV</button>
    <button onclick="setCam('player_east')">2. East Lawn VR POV</button>
    <button onclick="setCam('iso')">3. Isometric Overview</button>
    <button onclick="setCam('aerial')">4. Top-Down Aerial</button>
    <button onclick="setCam('playgrounds')">5. Playgrounds View</button>
    <button onclick="setCam('house')">6. Eddie House View</button>
    <button class="btn-wide" onclick="toggleRef()">Toggle Source Aerial Photo Reference</button>
  </div>
  <div class="controls-hint">
    Drag to orbit &bull; Scroll/Pinch to zoom &bull; Right-drag to pan &bull; <b>WASD / Arrows</b> to walk
  </div>
</div>
<div id="ref-card" class="visible">
  <h2><span>Source Aerial Image (Eddie Park &amp; House)</span><button onclick="toggleRef()" style="padding:2px 7px;font-size:11px;">Hide</button></h2>
  <img src="./aerial_ref.jpg" alt="Source Aerial Photo" />
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';

const loaderMsg = document.getElementById('park-loading');
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;
container.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.25, 450);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

// Calibrated 123 deg ESE azimuth, 39.5 deg elevation sun vector matching Software3DRenderer
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(64.71, 63.61, 42.03);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 4096;
dirLight.shadow.mapSize.height = 4096;
dirLight.shadow.camera.near = 5;
dirLight.shadow.camera.far = 200;
const d = 72;
dirLight.shadow.camera.left = -d;
dirLight.shadow.camera.right = d;
dirLight.shadow.camera.top = d;
dirLight.shadow.camera.bottom = -d;
dirLight.shadow.bias = -0.0006;
dirLight.shadow.normalBias = 0.0;
scene.add(dirLight);

function createShadowCasterDepthMaterial() {
  const depthMat = new THREE.MeshDepthMaterial({
    depthPacking: THREE.RGBADepthPacking,
    side: THREE.DoubleSide,
  });
  depthMat.onBeforeCompile = (shader) => {
    shader.vertexShader = shader.vertexShader.replace(
      '#include <common>',
      '#include <common>\nvarying vec3 vWorldPosDepth;\nvarying vec3 vWorldNormDepth;'
    );
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\nvWorldPosDepth = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvWorldNormDepth = normalize(normal);'
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <common>',
      '#include <common>\nvarying vec3 vWorldPosDepth;\nvarying vec3 vWorldNormDepth;'
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      'void main() {',
      `void main() {
      // Ground/lawn/sand/road surfaces (cast_shadow=False in Software3DRenderer) do not cast shadows onto themselves
      if (vWorldPosDepth.y < 0.52 && abs(vWorldNormDepth.y) > 0.88) discard;
      if (vWorldPosDepth.y > 28.0) discard;
      `
    );
  };
  return depthMat;
}

function createVibrantParkMaterial() {
  const mat = new THREE.MeshLambertMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
  });
  mat.onBeforeCompile = (shader) => {
    shader.vertexShader = shader.vertexShader.replace(
      '#include <common>',
      '#include <common>\nvarying vec3 vWorldPosCustom;\nvarying vec3 vWorldNormCustom;'
    );
    shader.vertexShader = shader.vertexShader.replace(
      '#include <worldpos_vertex>',
      '#include <worldpos_vertex>\nvWorldPosCustom = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvWorldNormCustom = normalize(objectNormal);'
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <common>',
      '#include <common>\nvarying vec3 vWorldPosCustom;\nvarying vec3 vWorldNormCustom;'
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      'vec3 outgoingLight = reflectedLight.directDiffuse + reflectedLight.indirectDiffuse + totalEmissiveRadiance;',
      `
      vec3 N = normalize(vWorldNormCustom);
      if (dot(N, cameraPosition - vWorldPosCustom) < 0.0) N = -N;
      vec3 L = normalize(vec3(0.6471, 0.6361, 0.4203));
      float raw_dot = dot(N, L);

      vec3 base_c = vColor.rgb;
      bool isCloud = (vWorldPosCustom.y > 28.0);
      bool isFoliage = (!isCloud) && (vWorldPosCustom.y > 0.35) && (
        (base_c.g > base_c.r * 1.05 && base_c.g > base_c.b * 1.03) ||
        (base_c.r > 0.60 && base_c.b > 0.52 && vWorldPosCustom.y > 1.2)
      );

      float ndotl = (isFoliage || isCloud)
        ? max(0.22, (raw_dot + 0.50) / 1.50)
        : max(0.0, raw_dot);
      float sky_hemi = 0.5 * (N.y + 1.0);

      float shadowMask = 1.0;
      #if defined( USE_SHADOWMAP ) && ( NUM_DIR_LIGHT_SHADOWS > 0 )
      DirectionalLightShadow dirShad = directionalLightShadows[ 0 ];
      shadowMask = receiveShadow ? getShadow( directionalShadowMap[ 0 ], dirShad.shadowMapSize, dirShad.shadowBias, dirShad.shadowRadius, vDirectionalShadowCoord[ 0 ] ) : 1.0;
      #endif

      float lit_frac = isCloud ? 1.0 : (isFoliage ? (0.36 + 0.64 * shadowMask) : shadowMask);

      vec3 lit_rgb;
      if (isCloud) {
        vec3 c_shade = mix(vec3(0.82, 0.89, 0.97), vec3(1.02, 1.01, 1.00), ndotl);
        lit_rgb = base_c * c_shade;
      } else {
        vec3 amb_sky = vec3(0.44, 0.52, 0.60);
        vec3 amb_gnd = vec3(0.34, 0.40, 0.34);
        vec3 sun_color = vec3(1.02, 0.97, 0.90);
        vec3 amb_c = mix(amb_gnd, amb_sky, sky_hemi);
        float dir_factor = (0.14 + 0.62 * ndotl) * lit_frac;
        lit_rgb = base_c * (amb_c + sun_color * dir_factor);
        if (!isFoliage) {
          float shd_weight = 1.0 - lit_frac;
          vec3 shadow_tint = vec3(0.22, 0.34, 0.52) * base_c;
          lit_rgb = mix(lit_rgb, shadow_tint, 0.42 * shd_weight);
        }
      }
      gl_FragColor = vec4(clamp(lit_rgb, 0.0, 1.0), 1.0);
      return;
      vec3 outgoingLight = lit_rgb;
      `
    );
  };
  return mat;
}

const loader = new GLTFLoader();
loader.load(
  './eddie_park_vr.glb',
  (gltf) => {
    const customMat = createVibrantParkMaterial();
    const customDepth = createShadowCasterDepthMaterial();
    gltf.scene.traverse((child) => {
      if (child.isMesh) {
        child.material = customMat;
        child.customDepthMaterial = customDepth;
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    scene.add(gltf.scene);
    if (loaderMsg) {
      loaderMsg.style.opacity = '0';
      setTimeout(() => loaderMsg.remove(), 300);
    }
  },
  (xhr) => {
    if (loaderMsg && xhr.total > 0) {
      const pct = Math.min(100, Math.round((xhr.loaded / xhr.total) * 100));
      loaderMsg.textContent = `Loading 3D Low-Poly Park Model... ${pct}%`;
    }
  },
  (err) => {
    console.error('Error loading GLB:', err);
    if (loaderMsg) loaderMsg.textContent = 'Error loading 3D model: ' + err;
  }
);

window.toggleRef = () => {
  document.getElementById('ref-card').classList.toggle('visible');
};

window.setCam = (mode) => {
  if (mode === 'player_west') {
    camera.position.set(-33.93, 1.75, -1.28);
    controls.target.set(17.25, 2.2, -1.28);
  } else if (mode === 'player_east') {
    camera.position.set(36, 12.5, 3);
    controls.target.set(-14, 1.5, -4);
  } else if (mode === 'iso') {
    camera.position.set(-55, 48, 20);
    controls.target.set(10, 0, -3);
  } else if (mode === 'aerial') {
    camera.position.set(0, 95, 0.1);
    controls.target.set(0, 0, 0);
  } else if (mode === 'playgrounds') {
    camera.position.set(-8, 12, 6);
    controls.target.set(4, 1, -22);
  } else if (mode === 'house') {
    camera.position.set(16, 12, 2);
    controls.target.set(36, 4, 22);
  }
  controls.update();
};
setCam('iso');

const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

const fwdVec = new THREE.Vector3();
const rightVec = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 0.65 : 0.28;
  camera.getWorldDirection(fwdVec);
  fwdVec.y = 0;
  if (fwdVec.lengthSq() > 1e-6) fwdVec.normalize();
  rightVec.crossVectors(fwdVec, camera.up).normalize();

  if (keys['KeyW'] || keys['ArrowUp']) {
    camera.position.addScaledVector(fwdVec, speed);
    controls.target.addScaledVector(fwdVec, speed);
  }
  if (keys['KeyS'] || keys['ArrowDown']) {
    camera.position.addScaledVector(fwdVec, -speed);
    controls.target.addScaledVector(fwdVec, -speed);
  }
  if (keys['KeyA'] || keys['ArrowLeft']) {
    camera.position.addScaledVector(rightVec, -speed);
    controls.target.addScaledVector(rightVec, -speed);
  }
  if (keys['KeyD'] || keys['ArrowRight']) {
    camera.position.addScaledVector(rightVec, speed);
    controls.target.addScaledVector(rightVec, speed);
  }
  controls.update();
  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
